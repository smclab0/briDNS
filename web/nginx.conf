server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Keep redirects relative so they work behind a mapped port (8088 -> 80)
    absolute_redirect off;

    # Sign-in page: public
    location = /login {
        try_files /login.html =404;
    }
    location = /login.html {
        return 301 /login;
    }

    # API: login/logout are public, the API checks the session for everything else
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # Session check used by auth_request
    location = /_auth {
        internal;
        proxy_pass http://api:8000/api/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Console: signed-in users only
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    location @login {
        return 302 /login;
    }
}
